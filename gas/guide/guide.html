<title>部活アプリ GAS版の貼り付けガイド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
/* 得点板の緑と縫い目の赤。1画面に1ステップ、下に大きなボタン */
:root{
  --bg:#f3f5f1; --card:#ffffff; --ink:#0f2a21; --ink2:#4a6158; --rule:#d4dcd1;
  --board:#123f31; --red:#c42b3b; --ok:#1e7a46; --soft:#e8efe9; --key:#f7f9f5; --warn-bg:#fff1cf; --warn:#7a5200;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1b16; --card:#13261f; --ink:#eef3ee; --ink2:#a9bdb3; --rule:#28443a; --board:#1d5443; --red:#e05463; --ok:#4cc184; --soft:#173229; --key:#0f211b; --warn-bg:#3a2f12; --warn:#f2cf7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1b16; --card:#13261f; --ink:#eef3ee; --ink2:#a9bdb3; --rule:#28443a; --board:#1d5443; --red:#e05463; --ok:#4cc184; --soft:#173229; --key:#0f211b; --warn-bg:#3a2f12; --warn:#f2cf7a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--num);font-weight:800;letter-spacing:.22em;color:var(--red);font-size:14px;text-transform:uppercase}
h1{margin:0;font-size:clamp(24px,5.4vw,32px);font-weight:900;line-height:1.35;text-wrap:balance}
.lead{margin:0;color:var(--ink2);font-size:15px}
.progress{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;gap:4px}
.bar i{height:8px;border-radius:4px;background:var(--rule)}
.bar i.done{background:var(--ok)} .bar i.now{background:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink2)}
.meta b{font-family:var(--num);font-size:20px;color:var(--ink);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;gap:14px;align-items:center}
.no{flex:none;width:52px;height:52px;border-radius:50%;background:var(--board);color:#f5f7f2;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:28px}
h2{margin:0;font-size:21px;font-weight:900;line-height:1.4;text-wrap:balance}
.desc{margin:0;color:var(--ink2);font-size:15px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;min-width:0}
ol.steps li::before{content:counter(s) "．";font-family:var(--num);font-weight:800;font-size:20px;color:var(--red);line-height:1.5}
ol.steps li>span{min-width:0}
kbd{display:inline-block;padding:0 7px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;background:var(--key);font-family:var(--num);font-weight:700;font-size:15px;line-height:1.5;color:var(--ink)}
.ui{font-weight:700;background:var(--soft);padding:1px 6px;border-radius:5px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.65}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.copy{appearance:none;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:var(--jp);font-weight:900;font-size:18px;min-height:64px;padding:10px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.copy small{font-weight:700;font-size:13px;opacity:.9}
.copy.ok{background:var(--ok)}
.copy:focus-visible,.nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.fallback{width:100%;min-height:140px;font-size:12px;font-family:ui-monospace,monospace;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--key);color:var(--ink)}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nav button{appearance:none;border-radius:14px;min-height:56px;font-family:var(--jp);font-weight:900;font-size:17px;cursor:pointer}
.prev{background:var(--card);color:var(--ink);border:2px solid var(--rule)}
.next{background:var(--red);color:#fff;border:0}
.prev:disabled{opacity:.35;cursor:default}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:14px}
.files span{background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:700}
.files em{font-style:normal;font-family:var(--num);color:var(--ink2);margin-left:6px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">Google Apps Script ・ 段階1 土台</span>
    <h1>部活アプリを学校のGoogleで動かす</h1>
    <p class="lead">1ステップずつ進みます。終わったら画面のスクリーンショットをClaudeに送ってください。次の手順を案内します。</p>
  </header>
  <div class="progress">
    <div class="bar" id="bar"></div>
    <div class="meta"><span>ステップ <b id="cur">1</b> / <b id="tot">9</b></span><span>所要 約<b>15</b>分</span></div>
  </div>
  <section class="card" id="card" aria-live="polite"></section>
  <div class="nav">
    <button type="button" class="prev" id="prev">← 前へ</button>
    <button type="button" class="next" id="next">できた・次へ →</button>
  </div>
</div>

<script type="application/json" id="files">{"Code": "/**\n * 部活アプリ「桜・浅羽野・住吉」 GAS版（サーバー側）\n *\n * このファイルは、スプレッドシートの読み書きと、ログインした人の確認をします。\n * 画面は Index.html（と Vendor.html・App1.html… を読み込み）で作っています。\n *\n * ・最初に1回だけ setup を実行してください（シートの見出し・最初のデータ・設定を自動で作ります）。\n * ・設定（スプレッドシートのIDなど）は「スクリプト プロパティ」に入ります。コードには書きません。\n */\n\nvar APP_VERSION = '段階1（2026-10-27）';\n\n// ───── データの置き場所（シート）の決まり ─────\n//  json: true   … 中身の多いもの。1つのマス（data）にまとめて入れ、主な項目は見やすさのため別の列にも出す\n//  cols         … 列（[名前, 種類]）。種類 s=文字 n=数 b=はい/いいえ\n//  ss           … main＝メインのスプレッドシート、ops＝大会運営のスプレッドシート\nvar SCHEMA = {\n  activities: { sheet: '予定', ss: 'main', json: true, cols: [['date', 's']] },\n  notices: { sheet: '送付書', ss: 'main', json: true, cols: [['date', 's'], ['subject', 's'], ['to', 's']] },\n  lineups: { sheet: 'メンバー表', ss: 'main', json: true, cols: [['date', 's'], ['title', 's'], ['opponent', 's']] },\n  players: { sheet: '選手', ss: 'main', cols: [['name', 's'], ['kana', 's'], ['teamId', 's'], ['grade', 'n'], ['number', 's'], ['active', 'b']] },\n  teams: { sheet: '学校', ss: 'main', cols: [['name', 's'], ['shortName', 's'], ['order', 'n'], ['active', 'b']] },\n  staff: {\n    sheet: 'スタッフ', ss: 'main', idName: 'email',\n    cols: [['name', 's'], ['canCoach', 'b'], ['canUmpire', 'b'], ['canPlateUmpire', 'b'], ['canBaseUmpire', 'b'], ['phone', 's'], ['note', 's'], ['active', 'b']]\n  },\n  directory: { sheet: '名簿', ss: 'main', cols: [['kind', 's'], ['name', 's'], ['number', 's'], ['extra', 's']] },\n  packingItems: { sheet: '持ち物', ss: 'main', cols: [['name', 's'], ['order', 'n'], ['active', 'b']] },\n  opsTournaments: { sheet: '大会運営', ss: 'ops', json: true, cols: [['name', 's'], ['rule', 's'], ['date', 's']] },\n  opsStaff: { sheet: '大会運営名簿', ss: 'ops', idName: 'email', cols: [['name', 's'], ['active', 'b']] }\n};\n\nvar INITIAL_TEAMS = [\n  { id: 'sakura', name: '桜中学校', shortName: '桜中', order: 1, active: true },\n  { id: 'asabano', name: '浅羽野中学校', shortName: '浅羽野中', order: 2, active: true },\n  { id: 'sumiyoshi', name: '住吉中学校', shortName: '住吉中', order: 3, active: true }\n];\nvar INITIAL_ITEMS = ['軽食', 'お弁当', '水筒', '着替え', '筆記用具', 'メモ帳', '野球note', '半袖', '短パン', 'ユニフォーム', 'グローブ', 'スパイク', '帽子', '防寒着', '雨具'];\nvar INITIAL_VENUES = [\n  { id: 'preset-asabano', kind: 'venue', name: '坂戸市立浅羽野中学校', number: '坂戸市浅羽753-1', extra: '東武東上線・越生線 坂戸駅 徒歩約13分' },\n  { id: 'preset-sakura', kind: 'venue', name: '坂戸市立桜中学校', number: '坂戸市泉町3-25-8', extra: '東武東上線 北坂戸駅 徒歩約13分' },\n  { id: 'preset-sumiyoshi', kind: 'venue', name: '坂戸市立住吉中学校', number: '坂戸市塚越114-1', extra: '東武東上線 若葉駅からバス「塚越」バス停下車 徒歩10分' }\n];\n\n// ═════════ 最初に1回だけ実行する ═════════\nfunction setup() {\n  var props = PropertiesService.getScriptProperties();\n  var owner = (Session.getEffectiveUser().getEmail() || '').toLowerCase();\n  var setOwner = (props.getProperty('OWNER_EMAIL') || '').toLowerCase();\n  if (setOwner && owner !== setOwner) throw new Error('setup は持ち主（' + setOwner + '）だけが実行できます');\n\n  // メインのスプレッドシート：このスクリプトを開いたスプレッドシート（なければ新しく作る）\n  var mainId = props.getProperty('SHEET_ID');\n  if (!mainId) {\n    var active = null;\n    try { active = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { active = null; }\n    if (!active) active = SpreadsheetApp.create('部活アプリ（データ）');\n    mainId = active.getId();\n    props.setProperty('SHEET_ID', mainId);\n  }\n  // 大会運営のスプレッドシート：大会運営だけの人に共有するので、別にする\n  var opsId = props.getProperty('OPS_SHEET_ID');\n  if (!opsId) {\n    opsId = SpreadsheetApp.create('部活アプリ（大会運営）').getId();\n    props.setProperty('OPS_SHEET_ID', opsId);\n  }\n  if (!props.getProperty('OWNER_EMAIL') && owner) props.setProperty('OWNER_EMAIL', owner);\n  owner = props.getProperty('OWNER_EMAIL') || owner;\n\n  // シートと見出しを作る\n  Object.keys(SCHEMA).forEach(function (col) { sheetOf_(col); });\n  // 最初から使う「シート1」が空なら消す\n  [mainId, opsId].forEach(function (id) {\n    var ss = SpreadsheetApp.openById(id);\n    var first = ss.getSheetByName('シート1') || ss.getSheetByName('Sheet1');\n    if (first && ss.getSheets().length > 1 && first.getLastRow() === 0) ss.deleteSheet(first);\n  });\n\n  var now = Date.now();\n  // 学校3校・持ち物15品目・会場3校（まだ何も無いときだけ）\n  if (readCol_('teams').length === 0) INITIAL_TEAMS.forEach(function (t) { putDoc_('teams', t.id, t, owner, now); });\n  if (readCol_('packingItems').length === 0) {\n    INITIAL_ITEMS.forEach(function (name, i) {\n      var id = 'item' + ('0' + (i + 1)).slice(-2);\n      putDoc_('packingItems', id, { name: name, order: i + 1, active: true }, owner, now);\n    });\n  }\n  if (!readCol_('directory').some(function (d) { return d.kind === 'venue'; })) {\n    INITIAL_VENUES.forEach(function (v) { putDoc_('directory', v.id, v, owner, now); });\n  }\n  // 持ち主をスタッフ名簿の最初の人に\n  if (owner && !findRow_('staff', owner)) {\n    putDoc_('staff', owner, {\n      name: Session.getEffectiveUser().getEmail(), canCoach: true, canUmpire: true, canPlateUmpire: true,\n      canBaseUmpire: true, phone: '', note: '持ち主', active: true\n    }, owner, now);\n  }\n  clearCache_();\n  Logger.log('準備ができました。メイン：' + mainId + '　大会運営：' + opsId + '　持ち主：' + owner);\n  return '準備ができました';\n}\n\n// ═════════ 画面を開いたとき ═════════\nfunction doGet(e) {\n  var t = HtmlService.createTemplateFromFile('Index');\n  t.params = JSON.stringify((e && e.parameter) || {}).replace(/<\/g, '\\\\u003c');\n  return t.evaluate()\n    .setTitle('桜・浅羽野・住吉')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.DEFAULT);\n}\n\n// HTMLの中に別のファイル（App1.html など）を差し込む。\n// App1・App2 は画面のプログラムの文字だけなので、HTMLとして調べずにそのまま入れる\nfunction include(name) {\n  return HtmlService.createTemplateFromFile(name).getRawContent();\n}\n\n// ═════════ 画面から呼ぶもの ═════════\n\n// 開いたときに1回：だれか確かめて、使うデータをまとめて返す\nfunction boot() {\n  var email = myEmail_();\n  var url = ScriptApp.getService().getUrl();\n  if (!email) return { state: 'nologin', url: url };\n  var role = roleOf_(email, true);\n  if (role.state === 'staff') {\n    var data = {};\n    Object.keys(SCHEMA).forEach(function (col) { data[col] = readColCached_(col); });\n    return { state: 'staff', me: role.me, data: data, url: url, owner: ownerEmail_(), version: APP_VERSION, now: Date.now() };\n  }\n  if (role.state === 'ops') {\n    return { state: 'ops', name: role.name, email: email, data: { opsTournaments: readColCached_('opsTournaments') }, url: url, version: APP_VERSION, now: Date.now() };\n  }\n  return { state: 'denied', email: email, message: role.message || '', url: url };\n}\n\n// 保存：[{col, id, doc}]（doc が null なら消す）。この行だけを書きます\nfunction write(ops) {\n  var email = myEmail_();\n  var role = roleOf_(email, false);\n  if (role.state !== 'staff' && role.state !== 'ops') throw new Error('このアカウントでは保存できません');\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  var warnings = [];\n  try {\n    var now = Date.now();\n    (ops || []).forEach(function (op) {\n      var def = SCHEMA[op.col];\n      if (!def) throw new Error('知らない種類のデータです：' + op.col);\n      if (role.state === 'ops' && op.col !== 'opsTournaments') throw new Error('大会運営だけの人は、このデータを保存できません');\n      var id = String(op.id || '');\n      if (!id) throw new Error('IDがありません');\n      if (op.doc) putDoc_(op.col, id, op.doc, email, now);\n      else deleteDoc_(op.col, id);\n      // スタッフ・大会運営の名簿を変えたら、スプレッドシートの共有も合わせる\n      if (op.col === 'staff' || op.col === 'opsStaff') {\n        var w = syncShare_(op.col, id, op.doc);\n        if (w) warnings.push(w);\n      }\n    });\n    clearCache_();\n  } finally {\n    lock.releaseLock();\n  }\n  return { ok: true, warnings: warnings, now: Date.now() };\n}\n\n// ほかの人の変更を読み直す（画面を開いたまま戻ってきたとき）\nfunction reload() {\n  return boot();\n}\n\n// ═════════ だれか確かめる ═════════\nfunction myEmail_() {\n  return (Session.getActiveUser().getEmail() || '').trim().toLowerCase();\n}\nfunction ownerEmail_() {\n  return (PropertiesService.getScriptProperties().getProperty('OWNER_EMAIL') || '').toLowerCase();\n}\n\n// staff＝スタッフ名簿の人／ops＝大会運営名簿の人／denied＝どちらでもない\nfunction roleOf_(email, fresh) {\n  if (!email) return { state: 'denied' };\n  var uc = CacheService.getUserCache();\n  if (!fresh) {\n    var hit = uc.get('role');\n    if (hit) { var r = JSON.parse(hit); if (r.email === email) return r; }\n  }\n  var res = { state: 'denied', email: email };\n  var main = null;\n  try { main = ssOf_('main'); } catch (e) { main = null; }\n  if (main) {\n    var row = findRow_('staff', email);\n    if (row && row.doc.active !== false) {\n      res = { state: 'staff', email: email, me: staffOut_(email, row.doc) };\n    } else if (!row && email === ownerEmail_()) {\n      // 持ち主がまだ名簿に無ければ、自動で載せる\n      var me = { name: email, canCoach: true, canUmpire: true, canPlateUmpire: true, canBaseUmpire: true, phone: '', note: '持ち主', active: true };\n      putDoc_('staff', email, me, email, Date.now());\n      clearCache_();\n      res = { state: 'staff', email: email, me: staffOut_(email, me) };\n    }\n  }\n  if (res.state === 'denied') {\n    try {\n      var o = findRow_('opsStaff', email);\n      if (o && o.doc.active !== false) res = { state: 'ops', email: email, name: String(o.doc.name || email) };\n    } catch (e2) { /* 大会運営のシートも開けない＝どちらにも入っていない */ }\n  }\n  uc.put('role', JSON.stringify(res), 300);\n  return res;\n}\nfunction staffOut_(email, d) {\n  return {\n    email: email, name: String(d.name || email), canCoach: d.canCoach === true, canUmpire: d.canUmpire === true,\n    canPlateUmpire: d.canPlateUmpire === true, canBaseUmpire: d.canBaseUmpire === true,\n    phone: String(d.phone || ''), note: String(d.note || ''), active: d.active !== false\n  };\n}\n\n// ═════════ スプレッドシートの共有を名簿に合わせる ═════════\nfunction syncShare_(col, email, doc) {\n  email = String(email).toLowerCase();\n  if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) return '';\n  if (email === ownerEmail_()) return '';\n  var on = !!(doc && doc.active !== false);\n  var props = PropertiesService.getScriptProperties();\n  // スタッフ：メインと大会運営の両方。大会運営名簿：大会運営だけ\n  var targets = col === 'staff' ? ['SHEET_ID', 'OPS_SHEET_ID'] : ['OPS_SHEET_ID'];\n  // 大会運営名簿から外しても、スタッフなら大会運営のシートは外さない（逆も同じ）\n  var stillStaff = col === 'opsStaff' && !on && (function () { var r = findRow_('staff', email); return r && r.doc.active !== false; })();\n  var stillOps = col === 'staff' && !on && (function () { try { var r = findRow_('opsStaff', email); return r && r.doc.active !== false; } catch (e) { return false; } })();\n  try {\n    targets.forEach(function (key) {\n      var id = props.getProperty(key);\n      if (!id) return;\n      var file = SpreadsheetApp.openById(id);\n      if (on) {\n        file.addEditor(email);\n      } else {\n        if (key === 'OPS_SHEET_ID' && (stillStaff || stillOps)) return;\n        try { file.removeEditor(email); } catch (e) { /* もともと共有していない */ }\n      }\n    });\n  } catch (e) {\n    return on\n      ? '名簿には入りましたが、スプレッドシートの共有ができませんでした（' + email + ' がGoogleアカウントか確かめてください）。'\n      : '名簿からは外しましたが、スプレッドシートの共有を外せませんでした。スプレッドシートの「共有」から外してください。';\n  }\n  return '';\n}\n\n// ═════════ シートの読み書き ═════════\nfunction ssOf_(which) {\n  var key = which === 'ops' ? 'OPS_SHEET_ID' : 'SHEET_ID';\n  var id = PropertiesService.getScriptProperties().getProperty(key);\n  if (!id) throw new Error('まだ setup を実行していません（' + key + ' がありません）');\n  return SpreadsheetApp.openById(id);\n}\n\nfunction headersOf_(col) {\n  var def = SCHEMA[col];\n  var h = [def.idName || 'id'];\n  def.cols.forEach(function (c) { h.push(c[0]); });\n  if (def.json) h.push('data');\n  h.push('updatedAt', 'updatedBy');\n  return h;\n}\n\nfunction sheetOf_(col) {\n  var def = SCHEMA[col];\n  var ss = ssOf_(def.ss);\n  var sh = ss.getSheetByName(def.sheet);\n  if (!sh) {\n    sh = ss.insertSheet(def.sheet);\n    var h = headersOf_(col);\n    sh.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#123f31').setFontColor('#ffffff');\n    sh.setFrozenRows(1);\n    // 文字の列は「書式なしテキスト」に（090-… や 背番号 01 が数に変わらないように）\n    sh.getRange(2, 1, sh.getM function render(){
  const st = STEPS[i];
  bar.innerHTML = STEPS.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("");
  document.getElementById("cur").textContent = i + 1;
  const list = [...(st.pre || []), ...(st.file ? paste(st.file, st.where) : []), ...(st.s || [])];
  document.getElementById("card").innerHTML = `
    <div class="head"><span class="no">${i + 1}</span><h2>${st.t}</h2></div>
    <p class="desc">${st.d}</p>
    <ol class="steps">${list.map(x => `<li><span>${x}</span></li>`).join("")}</ol>
    ${st.file ? `<button type="button" class="copy" id="copy">プログラムをまるごとコピー<small>${st.file === "Code" ? "コード.gs" : st.file + ".html"}・約${lines(st.file)}行</small></button><div id="fb"></div>` : ""}
    ${st.note ? `<p class="note">${st.note}</p>` : ""}
    ${st.tip ? `<p class="tip">${st.tip}</p>` : ""}`;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").textContent = i === STEPS.length - 1 ? "最初のステップへ" : "できた・次へ →";
  const b = document.getElementById("copy");
  if (b) b.onclick = () => {
    const text = F(st.file);
    const done = () => { b.classList.add("ok"); b.firstChild.textContent = "コピーしました"; };
    const fallback = () => {
      document.getElementById("fb").innerHTML = `<p class="note">うまくコピーできませんでした。下の枠を押して ${K("Ctrl")}＋${K("A")} → ${K("Ctrl")}＋${K("C")} でコピーしてください。</p><textarea class="fallback" id="fbt" readonly></textarea>`;
      const t = document.getElementById("fbt"); t.value = text; t.focus(); t.select();
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e) { fallback(); }
  };
  try { localStorage.setItem("gas-guide-step", String(i)); } catch(e) {}
}
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); scrollTo(0,0); } };
document.getElementById("next").onclick = () => { i = i === STEPS.length - 1 ? 0 : i + 1; render(); scrollTo(0,0); };
render();
</script>
